<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perfDSA Cohort Viewer</title>
<!-- Local only: opens from disk, loads nothing from the network. Contains patient data - do not publish. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6a7282; --line: #e1e4ea; --accent: #2e6be6;
  --chip: #eef1f6; --warn: #b54708; --warnbg: #fff4e5; --ok: #067647; --okbg: #e7f6ec; --err: #b42318; --errbg: #fdecea;
  --top: #e4572e; --full_model: #2e86de; --full_grown: #1f9e6e; --canvas: #000;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b1f27; --ink: #e6e8ee; --muted: #9aa3b2; --line: #2c323d; --accent: #6b9bff;
    --chip: #252b36; --warn: #f5b25a; --warnbg: #3a2a12; --ok: #6fd69a; --okbg: #12301f; --err: #ff8a80; --errbg: #3b1714;
    --top: #ff7a52; --full_model: #5aa8ff; --full_grown: #3fcf95;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b1f27; --ink: #e6e8ee; --muted: #9aa3b2; --line: #2c323d; --accent: #6b9bff;
  --chip: #252b36; --warn: #f5b25a; --warnbg: #3a2a12; --ok: #6fd69a; --okbg: #12301f; --err: #ff8a80; --errbg: #3b1714;
  --top: #ff7a52; --full_model: #5aa8ff; --full_grown: #3fcf95;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .conf { font-size: 11px; color: var(--warn); background: var(--warnbg); padding: 2px 8px; border-radius: 10px; }
header .sp { flex: 1; }
.layout { display: grid; grid-template-columns: 290px 1fr; height: calc(100% - 41px); }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.filters { padding: 10px 12px; display: grid; grid-template-columns: 70px 1fr; gap: 6px 8px; align-items: center; border-bottom: 1px solid var(--line); }
.filters label { color: var(--muted); font-size: 12px; }
.filters .full { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; }
select, input[type=number], button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.count { padding: 6px 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.runlist { overflow-y: auto; flex: 1; }
.run { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.run:hover { background: var(--chip); }
.run.sel { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.run .l1 { display: flex; gap: 6px; align-items: center; font-weight: 500; }
.run .l2 { color: var(--muted); font-size: 11.5px; }
.badge { font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--chip); color: var(--muted); font-weight: 500; }
.badge.warn { background: var(--warnbg); color: var(--warn); }
.badge.err { background: var(--errbg); color: var(--err); }
.badge.ok { background: var(--okbg); color: var(--ok); }
main { overflow-y: auto; padding: 14px 16px 40px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.card h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h2 .opts { font-weight: 400; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); }
.top { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.3fr); gap: 14px; }
@media (max-width: 1200px) { .top { grid-template-columns: 1fr; } }
table.kv { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.kv td { padding: 2px 6px 2px 0; vertical-align: top; }
table.kv td:first-child { color: var(--muted); white-space: nowrap; width: 1%; padding-right: 14px; }
table.vt { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
table.vt th, table.vt td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.vt th:first-child, table.vt td:first-child { text-align: left; }
table.vt th { color: var(--muted); font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg text { fill: var(--muted); font-size: 11px; }
a { color: var(--accent); }
.grid { display: grid; gap: 10px; }
.pnl { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; min-width: 0; }
.pnl .ctl { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
.pnl .ctl select { font-size: 11.5px; padding: 1px 3px; max-width: 100%; }
.pnl .ctl .x { margin-left: auto; padding: 0 6px; }
.pnl canvas { width: 100%; aspect-ratio: 1; display: block; background: var(--canvas); border-radius: 4px; image-rendering: pixelated; cursor: crosshair; }
.pnl .cap { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; margin-top: 3px; min-height: 15px; }
.cbar { height: 8px; border-radius: 2px; margin-top: 3px; }
.cbar-l { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.toolbar .grp { display: flex; gap: 4px; align-items: center; padding-right: 10px; border-right: 1px solid var(--line); }
.toolbar .grp:last-child { border-right: 0; }
.muted { color: var(--muted); }
.errbox { color: var(--err); background: var(--errbg); padding: 6px 8px; border-radius: 6px; margin-top: 6px; font-size: 12px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 50vh; }
}
</style>
</head>
<body>
<header>
  <h1>perfDSA cohort viewer</h1>
  <span class="conf">Confidential · local file only</span>
  <span class="sp"></span>
  <span class="muted" id="hdrcount"></span>
  <select id="theme" title="Theme"><option value="">Auto theme</option><option value="light">Light</option><option value="dark">Dark</option></select>
</header>
<div class="layout">
  <aside>
    <div class="filters">
      <label>Dataset</label><select id="f-dataset"></select>
      <label>Patient</label><select id="f-patient"></select>
      <label>Plane</label><select id="f-plane"></select>
      <label>Site</label><select id="f-site"></select>
      <label>Variants</label><div class="full" id="f-variants" style="grid-column:auto"></div>
      <div class="full">
        <label><input type="checkbox" id="f-hidedup" checked> hide duplicates</label>
        <label><input type="checkbox" id="f-failed"> failed only</label>
        <label id="f-sel-l"><input type="checkbox" id="f-sel"> selected only</label>
      </div>
    </div>
    <div class="count" id="count"></div>
    <div class="runlist" id="runlist"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script src="index_data.js"></script>
<script>
"use strict";
const C = window.COHORT;
if (!C) document.getElementById("main").innerHTML = '<div class="empty">index_data.js not found next to index.html.</div>';
const V = C.variants, MAPS = C.maps;
const VLABEL = {ica_top: "ICA top", ica_full_model: "ICA full (model)", ica_full_grown: "ICA full (grown)"};
const VVAR = {ica_top: "--top", ica_full_model: "--full_model", ica_full_grown: "--full_grown"};
const UNIT = {CBV: "", CBF: "", MTT: "s", Tmax: "s", MINIP: ""};
const byId = Object.fromEntries(C.runs.map(r => [r.run_id, r]));
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const vcol = v => css(VVAR[v]);
const fmt = (x, d = 3) => x == null || Number.isNaN(x) ? "–" : (Math.abs(x) >= 1000 ? x.toFixed(0) : Number(x.toPrecision(d)).toString());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function load(key, dflt) { try { const v = localStorage.getItem("perfdsa." + key); return v == null ? dflt : JSON.parse(v); } catch { return dflt; } }
function save(key, v) { try { localStorage.setItem("perfdsa." + key, JSON.stringify(v)); } catch {} }

const S = {
  run: null,
  f: {dataset: "", patient: "", plane: "", site: "", variants: load("variants", V.slice()), hideDup: true, failed: false, sel: false},
  panels: null,
  zoom: load("zoom", true), contours: (c => ["own", "all", "none"].includes(c) ? c : "own")(load("contours", "own")), cmap: load("cmap", "jet"),
  scale: load("scale", "shared"), manual: load("manual", {}), cols: load("cols", 5),
  curve: load("curve", {resampled: true, native: true, pair: false, norm: false}),
};

// ---------------------------------------------------------------- theme
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
$("theme").value = load("theme", ""); applyTheme($("theme").value);
$("theme").onchange = e => { save("theme", e.target.value); applyTheme(e.target.value); renderAll(); };

// ---------------------------------------------------------------- filters + run list
const failed = r => r.errors.length > 0 || !r.has_data;
function fillSelect(el, label, values) {
  const cur = el.value;
  el.innerHTML = `<option value="">All ${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if (values.includes(cur)) el.value = cur;
}
const uniq = a => [...new Set(a)].sort();
fillSelect($("f-dataset"), "datasets", uniq(C.runs.map(r => r.dataset)));
fillSelect($("f-patient"), "patients", uniq(C.runs.map(r => r.patient_id)));
fillSelect($("f-plane"), "planes", uniq(C.runs.map(r => r.plane)));
fillSelect($("f-site"), "sites", uniq(C.runs.map(r => r.injection_site)));
$("f-variants").innerHTML = V.map(v => `<label title="${VLABEL[v]}"><input type="checkbox" value="${v}" ${S.f.variants.includes(v) ? "checked" : ""}> <span class="sw" style="background:${vcol(v)}"></span>${v.replace("ica_", "")}</label>`).join("");

function filtered() {
  const f = S.f;
  return C.runs.filter(r => (!f.dataset || r.dataset === f.dataset) && (!f.patient || r.patient_id === f.patient)
    && (!f.plane || r.plane === f.plane) && (!f.site || r.injection_site === f.site)
    && (!f.hideDup || !r.is_duplicate) && (!f.failed || failed(r)) && (!f.sel || (r.selection && r.selection.included)));
}
function readFilters() {
  S.f.dataset = $("f-dataset").value; S.f.patient = $("f-patient").value; S.f.plane = $("f-plane").value; S.f.site = $("f-site").value;
  S.f.hideDup = $("f-hidedup").checked; S.f.failed = $("f-failed").checked; S.f.sel = $("f-sel").checked;
  S.f.variants = [...$("f-variants").querySelectorAll("input:checked")].map(i => i.value);
  save("variants", S.f.variants);
}
if (!C.runs.some(r => r.selection)) $("f-sel-l").style.display = "none";
for (const id of ["f-dataset", "f-patient", "f-plane", "f-site", "f-hidedup", "f-failed", "f-sel"]) $(id).onchange = () => { readFilters(); renderList(); };
$("f-variants").onchange = () => { readFilters(); renderAll(); };

function renderList() {
  const runs = filtered();
  $("count").textContent = `${runs.length} of ${C.runs.length} runs · ${new Set(runs.map(r => r.patient_id)).size} patients`;
  $("hdrcount").textContent = `${C.runs.length} runs`;
  $("runlist").innerHTML = runs.map(r => {
    const b = [];
    if (r.is_duplicate) b.push(`<span class="badge warn" title="copy of ${esc(r.duplicate_of)}">dup</span>`);
    if (r.selection) b.push(r.selection.included ? '<span class="badge ok" title="included in the selection">selected</span>'
      : `<span class="badge" title="${esc(r.selection.reasons)}">excluded</span>`);
    if (failed(r)) b.push(`<span class="badge err" title="${esc(r.errors.map(e => e.variant + ": " + e.error).join("\n"))}">fail</span>`);
    const d = r.overlap && r.overlap["dice_ica_top_vs_ica_full_grown"];
    return `<div class="run ${r.run_id === S.run ? "sel" : ""}" data-id="${esc(r.run_id)}">
      <div class="l1">${esc(r.patient_id)} <span class="badge">S${String(r.series_number).padStart(2, "0")} ${esc(r.plane)}</span>${b.join("")}</div>
      <div class="l2">${esc(r.dataset)} · ${esc(r.injection_site)} · inj ${r.injection_number}/${r.n_injections_patient}${d != null ? ` · Dice top/grown ${d.toFixed(2)}` : ""}</div></div>`;
  }).join("") || '<div class="empty">No runs match.</div>';
  for (const el of $("runlist").querySelectorAll(".run")) el.onclick = () => selectRun(el.dataset.id);
  if (runs.length && (!S.run || !runs.some(r => r.run_id === S.run))) selectRun(runs[0].run_id);
}
document.addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp"].includes(e.key) || ["SELECT", "INPUT"].includes(document.activeElement.tagName)) return;
  const runs = filtered(), i = runs.findIndex(r => r.run_id === S.run);
  const j = Math.max(0, Math.min(runs.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
  if (j !== i) { e.preventDefault(); selectRun(runs[j].run_id); $("runlist").querySelector(".sel")?.scrollIntoView({block: "nearest"}); }
});

function partner(r) {
  if (!r || !r.ab_pair_id) return null;
  return C.runs.find(o => o.ab_pair_id === r.ab_pair_id && o.run_id !== r.run_id && !o.is_duplicate && o.plane !== r.plane) || null;
}

// ---------------------------------------------------------------- run data loading + decoding
const cache = new Map();  // run_id -> Promise<decoded>
function loadScript(id) {
  return new Promise((res, rej) => {
    if (window.RUN_DATA && window.RUN_DATA[id]) return res(window.RUN_DATA[id]);
    const s = document.createElement("script");
    s.src = "data/" + encodeURIComponent(id) + ".js";
    s.onload = () => { const d = window.RUN_DATA[id]; delete window.RUN_DATA[id]; s.remove(); d ? res(d) : rej(new Error("empty")); };
    s.onerror = () => rej(new Error("data/" + id + ".js not found"));
    document.head.appendChild(s);
  });
}
function decode(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0);
      res({w: img.width, h: img.height, rgba: x.getImageData(0, 0, img.width, img.height).data});
    };
    img.onerror = () => rej(new Error("image decode failed"));
    img.src = url;
  });
}
const channel = (im, c) => { const o = new Uint8Array(im.w * im.h); for (let i = 0; i < o.length; i++) o[i] = im.rgba[4 * i + c]; return o; };

async function decodeRun(id) {
  const d = await loadScript(id);
  const out = {size: d.size, variants: d.variants, minip: channel(await decode(d.minip), 0), masks: {}, maps: {}, hi: {}, mapSize: d.map_size};
  if (d.masks) {
    const m = await decode(d.masks);
    d.variants.forEach(v => { out.masks[v] = channel(m, V.indexOf(v)); });
    // bounding box of all masks, for zooming
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1; const n = d.size;
    for (const v of d.variants) { const a = out.masks[v]; for (let i = 0; i < a.length; i++) if (a[i]) { const x = i % n, y = (i / n) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    out.bbox = x1 >= 0 ? [x0, y0, x1, y1] : null;
    out.edges = {};
    for (const v of d.variants) out.edges[v] = edgeCanvas(out.masks[v], n, v);
  }
  for (const k of MAPS) {
    if (!d.maps || !d.maps[k]) continue;
    out.hi[k] = d.maps[k].hi; out.maps[k] = {};
    for (const v of d.variants) {
      const q = channel(await decode(d.maps[k][v]), 0), f = new Float32Array(q.length), s = d.maps[k].hi / 255;
      for (let i = 0; i < q.length; i++) f[i] = q[i] * s;
      out.maps[k][v] = f;
    }
  }
  return out;
}
function edgeCanvas(mask, n, v) {
  const c = document.createElement("canvas"); c.width = n; c.height = n;
  const x = c.getContext("2d"), im = x.createImageData(n, n), col = hexRgb(vcol(v));
  for (let y = 0; y < n; y++) for (let xx = 0; xx < n; xx++) {
    const i = y * n + xx; if (!mask[i]) continue;
    if (xx === 0 || y === 0 || xx === n - 1 || y === n - 1 || !mask[i - 1] || !mask[i + 1] || !mask[i - n] || !mask[i + n]) {
      im.data.set([col[0], col[1], col[2], 255], 4 * i);
    }
  }
  x.putImageData(im, 0, 0); c.dataset.v = v; return c;
}
function getRun(id) {
  if (!cache.has(id)) {
    cache.set(id, decodeRun(id));
    if (cache.size > 8) cache.delete(cache.keys().next().value);  // keep memory bounded
  }
  return cache.get(id);
}
function hexRgb(h) {
  h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join("");
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}

// ---------------------------------------------------------------- colormaps
const CMAPS = {
  jet: [[0, [0, 0, 131]], [.125, [0, 60, 170]], [.375, [5, 255, 255]], [.625, [255, 255, 0]], [.875, [250, 0, 0]], [1, [128, 0, 0]]],
  viridis: [[0, [68, 1, 84]], [.25, [59, 82, 139]], [.5, [33, 145, 140]], [.75, [94, 201, 98]], [1, [253, 231, 37]]],
  magma: [[0, [0, 0, 4]], [.25, [81, 18, 124]], [.5, [183, 55, 121]], [.75, [252, 137, 97]], [1, [252, 253, 191]]],
  gray: [[0, [0, 0, 0]], [1, [255, 255, 255]]],
  diverging: [[0, [33, 102, 172]], [.25, [103, 169, 207]], [.5, [247, 247, 247]], [.75, [239, 138, 98]], [1, [178, 24, 43]]],
};
const LUT = {};
for (const [k, stops] of Object.entries(CMAPS)) {
  const l = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let j = 0; while (j < stops.length - 2 && t > stops[j + 1][0]) j++;
    const [t0, c0] = stops[j], [t1, c1] = stops[j + 1], u = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
    for (let c = 0; c < 3; c++) l[3 * i + c] = Math.round(c0[c] + u * (c1[c] - c0[c]));
  }
  LUT[k] = l;
}
const gradient = k => `linear-gradient(90deg, ${CMAPS[k].map(([t, c]) => `rgb(${c}) ${t * 100}%`).join(", ")})`;

// ---------------------------------------------------------------- panels
function defaultPanels(kind) {
  const vs = S.f.variants.length ? S.f.variants : V, out = [];
  if (kind === "variants") for (const v of vs) for (const l of ["MINIP", ...MAPS]) out.push({run: "@cur", variant: v, layer: l, minus: ""});
  if (kind === "minip") for (const v of vs) out.push({run: "@cur", variant: v, layer: "MINIP", minus: ""});
  if (kind === "ab") for (const r of ["@cur", "@pair"]) for (const l of ["MINIP", ...MAPS]) out.push({run: r, variant: vs[0], layer: l, minus: ""});
  if (kind === "diff") for (const v of vs.filter(v => v !== "ica_top")) for (const l of MAPS) out.push({run: "@cur", variant: v, layer: l, minus: "ica_top"});
  if (kind === "map") { const l = (S.panels && S.panels.find(p => p.layer !== "MINIP")?.layer) || "CBV"; for (const v of vs) out.push({run: "@cur", variant: v, layer: l, minus: ""}); }
  return out;
}
S.panels = load("panels", null) || defaultPanels("variants");
function resolveRun(p) {
  const r = byId[S.run];
  if (p.run === "@cur") return r;
  if (p.run === "@pair") return partner(r);
  return byId[p.run] || null;
}

function toolbar() {
  const o = (v, l, cur) => `<option value="${v}" ${v === cur ? "selected" : ""}>${l}</option>`;
  return `<div class="toolbar">
    <div class="grp"><span class="muted">Preset</span>
      <button data-preset="variants">Variants × maps</button><button data-preset="minip">Masks</button>
      <button data-preset="ab">A vs B</button><button data-preset="diff">Δ vs ICA top</button><button data-preset="map">One map, all variants</button>
      <button id="addp" class="primary">+ Panel</button></div>
    <div class="grp"><span class="muted">Colormap</span><select id="cmap">${Object.keys(CMAPS).filter(k => k !== "diverging").map(k => o(k, k, S.cmap)).join("")}</select></div>
    <div class="grp"><span class="muted">Scale</span><select id="scale">${o("shared", "shared per map", S.scale)}${o("panel", "per panel", S.scale)}${o("manual", "manual max", S.scale)}</select>
      <span id="manual" style="display:${S.scale === "manual" ? "flex" : "none"};gap:4px">${MAPS.map(k => `<label class="muted">${k} <input type="number" step="any" min="0" data-k="${k}" value="${S.manual[k] ?? ""}" style="width:64px"></label>`).join("")}</span></div>
    <div class="grp"><label><input type="checkbox" id="zoom" ${S.zoom ? "checked" : ""}> zoom to masks</label>
      <span class="muted">Contours</span><select id="contours">${o("own", "panel's variant", S.contours)}${o("all", "all variants", S.contours)}${o("none", "none", S.contours)}</select></div>
    <div class="grp"><span class="muted">Columns</span><input type="number" id="cols" min="1" max="8" value="${S.cols}" style="width:48px"></div>
  </div>`;
}

function panelHtml(p, i, runs) {
  const o = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`;
  const runOpts = o("@cur", "Selected run", p.run) + o("@pair", "A/B partner", p.run) + runs.map(r => o(r.run_id, r.run_id.replace(/^PRAISE_BATCH_2_/, "B2 ").replace(/^PRAISE_/, ""), p.run)).join("");
  return `<div class="pnl" data-i="${i}"><div class="ctl">
      <select data-f="run" title="Run">${runOpts}</select>
      <select data-f="variant" title="AIF variant">${V.map(v => o(v, v.replace("ica_", ""), p.variant)).join("")}</select>
      <select data-f="layer" title="Layer">${["MINIP", ...MAPS].map(l => o(l, l, p.layer)).join("")}</select>
      ${p.layer === "MINIP" ? "" : `<select data-f="minus" title="Subtract another variant">${o("", "–", p.minus)}${V.map(v => o(v, "− " + v.replace("ica_", ""), p.minus)).join("")}</select>`}
      <button class="x" title="Remove panel">×</button></div>
    <canvas width="640" height="640"></canvas>
    <div class="cap"><span class="ttl"></span><span class="val"></span></div>
    <div class="cbar"></div><div class="cbar-l"><span class="lo"></span><span class="hi"></span></div></div>`;
}

async function renderPanels() {
  const host = $("panels"); if (!host) return;
  save("panels", S.panels);
  const runs = filtered();
  host.style.gridTemplateColumns = `repeat(${S.cols}, minmax(0, 1fr))`;
  host.innerHTML = S.panels.map((p, i) => panelHtml(p, i, runs)).join("") || '<div class="empty">No panels — pick a preset or add one.</div>';
  for (const el of host.querySelectorAll(".pnl")) {
    const i = +el.dataset.i;
    for (const s of el.querySelectorAll("select")) s.onchange = () => { S.panels[i][s.dataset.f] = s.value; if (s.dataset.f === "layer" && s.value === "MINIP") S.panels[i].minus = ""; renderPanels(); };
    el.querySelector(".x").onclick = () => { S.panels.splice(i, 1); renderPanels(); };
  }
  // load data, compute values, then shared scaling
  const jobs = await Promise.all(S.panels.map(async p => {
    const r = resolveRun(p); if (!r) return {p, err: p.run === "@pair" ? "no A/B partner" : "run not found"};
    if (!r.has_data) return {p, r, err: "no data for this run"};
    let d; try { d = await getRun(r.run_id); } catch (e) { return {p, r, err: e.message}; }
    if (!d.variants.includes(p.variant)) return {p, r, err: `${p.variant} not available`};
    if (p.layer === "MINIP") return {p, r, d, vals: d.minip, n: d.size, lo: 0, hi: 255, cmap: "gray"};
    let vals = d.maps[p.layer][p.variant], hi = d.hi[p.layer], lo = 0, cmap = S.cmap;
    if (p.minus) {
      if (!d.variants.includes(p.minus)) return {p, r, err: `${p.minus} not available`};
      const b = d.maps[p.layer][p.minus], diff = new Float32Array(vals.length);
      for (let i = 0; i < diff.length; i++) diff[i] = vals[i] - b[i];
      const abs = Array.from(diff, Math.abs).filter(x => x > 0).sort((a, b) => a - b);
      hi = abs.length ? abs[Math.floor(.99 * (abs.length - 1))] : 1; lo = -hi; vals = diff; cmap = "diverging";
    }
    return {p, r, d, vals, n: d.mapSize, lo, hi: hi || 1, cmap};
  }));
  if (S.scale === "shared") {
    const g = {};
    for (const j of jobs) if (j.vals && j.p.layer !== "MINIP") { const k = j.p.layer + (j.p.minus ? "Δ" : ""); g[k] = Math.max(g[k] || 0, j.hi); }
    for (const j of jobs) if (j.vals && j.p.layer !== "MINIP") { const k = j.p.layer + (j.p.minus ? "Δ" : ""); j.hi = g[k]; if (j.p.minus) j.lo = -g[k]; }
  } else if (S.scale === "manual") {
    for (const j of jobs) if (j.vals && j.p.layer !== "MINIP" && S.manual[j.p.layer] > 0) { j.hi = +S.manual[j.p.layer]; if (j.p.minus) j.lo = -j.hi; }
  }
  host.querySelectorAll(".pnl").forEach((el, i) => drawPanel(el, jobs[i]));
}

function drawPanel(el, j) {
  const cv = el.querySelector("canvas"), x = cv.getContext("2d");
  x.fillStyle = "#000"; x.fillRect(0, 0, cv.width, cv.height);
  const ttl = el.querySelector(".ttl");
  if (j.err) { x.fillStyle = "#999"; x.font = "48px system-ui"; x.textAlign = "center"; x.fillText(j.err, cv.width / 2, cv.height / 2); ttl.textContent = ""; el.querySelector(".cbar").style.background = "none"; return; }
  const {p, r, d, vals, n, lo, hi, cmap} = j;
  // layer image at its own resolution
  const base = document.createElement("canvas"); base.width = n; base.height = n;
  const bx = base.getContext("2d"), im = bx.createImageData(n, n), lut = LUT[cmap];
  for (let i = 0; i < vals.length; i++) {
    const q = Math.max(0, Math.min(255, Math.round(255 * (vals[i] - lo) / (hi - lo))));
    im.data[4 * i] = lut[3 * q]; im.data[4 * i + 1] = lut[3 * q + 1]; im.data[4 * i + 2] = lut[3 * q + 2]; im.data[4 * i + 3] = 255;
  }
  bx.putImageData(im, 0, 0);
  // crop window in full-resolution (d.size) coordinates
  let [cx0, cy0, cs] = [0, 0, d.size];
  if (S.zoom && d.bbox) {
    const [x0, y0, x1, y1] = d.bbox, pad = 70, side = Math.min(d.size, Math.max(x1 - x0, y1 - y0) + 2 * pad, d.size);
    cs = Math.max(side, 160); cx0 = Math.max(0, Math.min(d.size - cs, (x0 + x1) / 2 - cs / 2)); cy0 = Math.max(0, Math.min(d.size - cs, (y0 + y1) / 2 - cs / 2));
  }
  const f = n / d.size;
  x.imageSmoothingEnabled = !S.zoom;
  x.drawImage(base, cx0 * f, cy0 * f, cs * f, cs * f, 0, 0, cv.width, cv.height);
  if (S.contours !== "none" && d.edges) {
    x.imageSmoothingEnabled = false;
    // ~1.5 screen px thick, whatever the zoom and panel size: redraw the 1-px edges with small offsets
    const k = Math.max(1, Math.round(1.5 * cv.width / Math.max(cv.clientWidth, 1) - cv.width / cs)), offs = [];
    for (let dx = -k; dx <= k; dx++) for (let dy = -k; dy <= k; dy++) if (dx * dx + dy * dy <= k * k) offs.push([dx, dy]);
    const cvars = S.contours === "own" ? [p.variant, p.minus].filter(Boolean) : S.f.variants;
    for (const v of cvars) if (d.edges[v]) {
      for (const [dx, dy] of offs) x.drawImage(d.edges[v], cx0, cy0, cs, cs, dx, dy, cv.width, cv.height);
    }
  }
  const unit = UNIT[p.layer] ? " " + UNIT[p.layer] : "";
  ttl.innerHTML = `<span class="sw" style="background:${vcol(p.variant)}"></span>${esc(r.patient_id)} S${r.series_number} ${esc(r.plane)} · ${p.layer}${p.minus ? ` (${p.variant.replace("ica_", "")} − ${p.minus.replace("ica_", "")})` : ` · ${p.variant.replace("ica_", "")}`}`;
  el.querySelector(".cbar").style.background = gradient(cmap);
  el.querySelector(".lo").textContent = fmt(lo) + unit; el.querySelector(".hi").textContent = (p.layer === "MINIP" ? "" : "≥ ") + fmt(hi) + unit;
  const val = el.querySelector(".val");
  cv.onmousemove = e => {
    const b = cv.getBoundingClientRect(), fx = (e.clientX - b.left) / b.width, fy = (e.clientY - b.top) / b.height;
    const X = Math.floor((cx0 + fx * cs) * f), Y = Math.floor((cy0 + fy * cs) * f);
    if (X < 0 || Y < 0 || X >= n || Y >= n) return;
    const inM = d.masks ? Object.entries(d.masks).filter(([v, m]) => m[Math.floor(Y / f) * d.size + Math.floor(X / f)]).map(([v]) => v.replace("ica_", "")) : [];
    val.textContent = `(${Math.floor(X / f)}, ${Math.floor(Y / f)}) ${fmt(vals[Y * n + X])}${unit}${inM.length ? " · in " + inM.join(", ") : ""}`;
  };
  cv.onmouseleave = () => { val.textContent = ""; };
}

// ---------------------------------------------------------------- AIF chart
function aifChart(r) {
  const W = 640, H = 270, m = {l: 46, r: 12, t: 10, b: 32};
  const series = [];
  const add = (run, dash) => {
    if (!run) return;
    for (const v of S.f.variants) {
      const c = run.curves[v]; if (!c) continue;
      const norm = a => { if (!S.curve.norm) return a; const mx = Math.max(...a.filter(Number.isFinite)); return a.map(y => y / mx); };
      if (S.curve.resampled && c.t) series.push({v, dash, t: c.t, a: norm(c.a), line: true, run});
      if (S.curve.native && c.tn) series.push({v, dash, t: c.tn, a: norm(c.an), line: !S.curve.resampled, dots: true, run});
    }
  };
  add(r, ""); if (S.curve.pair) add(partner(r), "5 4");
  if (!series.length) return '<div class="muted">No AIF curves for this run.</div>';
  const all = series.flatMap(s => s.a.filter(Number.isFinite)), ts = series.flatMap(s => s.t);
  const ymin = Math.min(0, ...all), ymax = Math.max(...all) * 1.05, tmax = Math.max(...ts);
  const X = t => m.l + (W - m.l - m.r) * t / tmax, Y = y => m.t + (H - m.t - m.b) * (1 - (y - ymin) / (ymax - ymin));
  const ticks = (a, b, k) => { const s = Math.pow(10, Math.floor(Math.log10((b - a) / k))); const st = [1, 2, 5, 10].map(x => x * s).find(x => (b - a) / x <= k); const o = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) o.push(+v.toFixed(10)); return o; };
  let g = "";
  for (const v of ticks(ymin, ymax, 5)) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--line")}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 2)}</text>`;
  for (const v of ticks(0, tmax, 8)) g += `<text x="${X(v)}" y="${H - m.b + 15}" text-anchor="middle">${v}</text>`;
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${css("--muted")}" stroke-width=".6"/>`;
  g += `<text x="${(W + m.l) / 2}" y="${H - 3}" text-anchor="middle">time (s)</text><text transform="translate(11 ${H / 2}) rotate(-90)" text-anchor="middle">${S.curve.norm ? "AIF / peak" : "AIF [a.u.]"}</text>`;
  for (const s of series) {
    const col = vcol(s.v), pts = s.t.map((t, i) => [X(t), Y(s.a[i])]).filter(p => Number.isFinite(p[1]));
    if (s.line) g += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${s.dash}" points="${pts.map(p => p.join(",")).join(" ")}"><title>${esc(s.run.run_id)} · ${s.v}</title></polyline>`;
    if (s.dots) g += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.dash ? "none" : col}" stroke="${col}"/>`).join("");
  }
  const leg = S.f.variants.filter(v => r.curves[v]).map(v => `<span><span class="sw" style="background:${vcol(v)}"></span>${VLABEL[v]}</span>`).join(" &nbsp; ");
  const pr = partner(r);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="AIF curves">${g}</svg>
    <div class="muted" style="font-size:12px">${leg} · line = resampled 250 ms, dots = native frame times${S.curve.pair && pr ? ` · dashed / open = partner ${esc(pr.plane)} (${esc(pr.run_id)})` : ""}</div>`;
}

// ---------------------------------------------------------------- run details
function details(r) {
  const row = (k, v) => v === "" || v == null ? "" : `<tr><td>${k}</td><td>${v}</td></tr>`;
  const pr = partner(r);
  let kv = row("Run", esc(r.run_id)) + row("Dataset", esc(r.dataset)) + row("Series", `${r.series_number} · ${esc(r.series_description)}`)
    + row("Plane", esc(r.plane)) + row("Injection", `${r.injection_number} of ${r.n_injections_patient} · site ${esc(r.injection_site)} <span class="muted">(${esc(r.injection_site_source)})</span>`)
    + row("A/B pair", r.ab_pair_id ? `${esc(r.ab_pair_id)}${pr ? ` · partner <a href="#" data-go="${esc(pr.run_id)}">${esc(pr.plane)}</a>` : ""}` : "<span class='muted'>none</span>")
    + row("A/B offset", r.ab_pair_id ? `header ${fmt(r.ab_offset_ms_header)} ms (±1 s) · AIF arrival ${fmt(r.ab_offset_ms_aif_arrival)} ms` : "")
    + row("Acquired", esc(r.acquisition_start)) + row("Frames", `${r.n_frames} · ${fmt(r.duration_s)} s · ${esc(r.frame_rate_regime)} <span class="muted">(${esc(r.frame_interval_pattern)})</span>`)
    + row("Angles", `${fmt(r.primary_angle_deg)}° / ${fmt(r.secondary_angle_deg)}°`)
    + row("PRAISE.json", esc(r.praise_json_perf_eval))
    + (r.selection ? row("Selection", (r.selection.included ? '<span class="badge ok">included</span>' : `<span class="badge">excluded</span> ${esc(r.selection.reasons)}`)
        + ` <span class="muted">· EVT phase ${esc(r.selection.evt_phase)} · venous overlap ${fmt(r.selection.venous_frac_ica_top)} · AIF tail ${fmt(r.selection.aif_tail_ica_top)}</span>`) : "")
    + (r.is_duplicate ? row("Duplicate", `<span class="badge warn">${esc(r.duplicate_type)}</span> of <a href="#" data-go="${esc(r.duplicate_of)}">${esc(r.duplicate_of)}</a> (${esc(r.duplicate_scope)})`) : "");
  const vs = V.filter(v => r.perf[v]);
  const ov = r.overlap || {}, dice = v => v === "ica_top" ? "–" : fmt(ov[`dice_ica_top_vs_${v}`]);
  const tbl = vs.length ? `<table class="vt"><tr><th>variant</th><th>mask px</th><th>Dice vs top</th><th>AIF peak</th><th>TTP s</th><th>FWHM s</th><th>AUC</th><th>CBV</th><th>CBF</th><th>MTT</th><th>Tmax</th></tr>`
    + vs.map(v => { const p = r.perf[v]; return `<tr><td><span class="sw" style="background:${vcol(v)}"></span>${v.replace("ica_", "")}</td><td>${p.mask_px}</td><td>${dice(v)}</td><td>${fmt(p.aif_peak)}</td><td>${fmt(p.aif_ttp_s)}</td><td>${fmt(p.aif_fwhm_s)}</td><td>${fmt(p.aif_auc)}</td><td>${fmt(p.CBV_median)}</td><td>${fmt(p.CBF_median)}</td><td>${fmt(p.MTT_median)}</td><td>${fmt(p.Tmax_median)}</td></tr>`; }).join("")
    + `</table><div class="muted" style="font-size:11px;margin-top:3px">Map values: median over perfused pixels.</div>` : "";
  const errs = r.errors.map(e => `<div class="errbox"><b>${esc(e.variant)}</b>: ${esc(e.error)}</div>`).join("");
  return `<table class="kv">${kv}</table>${tbl}${errs}`;
}

function selectRun(id) {
  S.run = id;
  for (const el of $("runlist").querySelectorAll(".run")) el.classList.toggle("sel", el.dataset.id === id);
  renderMain();
}

function renderMain() {
  const r = byId[S.run];
  if (!r) { $("main").innerHTML = '<div class="empty">Select a run.</div>'; return; }
  const ck = (k, l) => `<label><input type="checkbox" data-c="${k}" ${S.curve[k] ? "checked" : ""}> ${l}</label>`;
  $("main").innerHTML = `<div class="top">
      <div class="card"><h2>${esc(r.patient_id)} · S${r.series_number} · plane ${esc(r.plane)}</h2>${details(r)}</div>
      <div class="card"><h2>AIF <span class="opts">${ck("resampled", "resampled")}${ck("native", "native")}${ck("pair", "overlay A/B partner")}${ck("norm", "normalise")}</span></h2><div id="chart">${aifChart(r)}</div></div>
    </div>
    <div class="card"><h2>Compare</h2>${toolbar()}<div class="grid" id="panels"></div></div>`;
  for (const a of $("main").querySelectorAll("[data-go]")) a.onclick = e => { e.preventDefault(); const t = a.dataset.go; if (!filtered().some(x => x.run_id === t)) { $("f-hidedup").checked = false; readFilters(); renderList(); } selectRun(t); };
  for (const c of $("main").querySelectorAll("[data-c]")) c.onchange = () => { S.curve[c.dataset.c] = c.checked; save("curve", S.curve); $("chart").innerHTML = aifChart(r); };
  for (const b of $("main").querySelectorAll("[data-preset]")) b.onclick = () => { S.panels = defaultPanels(b.dataset.preset); renderPanels(); };
  $("addp").onclick = () => { const l = S.panels[S.panels.length - 1]; S.panels.push(l ? {...l} : {run: "@cur", variant: "ica_top", layer: "CBV", minus: ""}); renderPanels(); };
  $("cmap").onchange = e => { S.cmap = e.target.value; save("cmap", S.cmap); renderPanels(); };
  $("scale").onchange = e => { S.scale = e.target.value; save("scale", S.scale); $("manual").style.display = S.scale === "manual" ? "flex" : "none"; renderPanels(); };
  for (const i of $("manual").querySelectorAll("input")) i.onchange = () => { S.manual[i.dataset.k] = i.value === "" ? null : +i.value; save("manual", S.manual); renderPanels(); };
  $("zoom").onchange = e => { S.zoom = e.target.checked; save("zoom", S.zoom); renderPanels(); };
  $("contours").onchange = e => { S.contours = e.target.value; save("contours", S.contours); renderPanels(); };
  $("cols").onchange = e => { S.cols = Math.max(1, Math.min(8, +e.target.value || 5)); save("cols", S.cols); renderPanels(); };
  renderPanels();
}

function renderAll() { cache.clear(); renderList(); renderMain(); }
renderList();
</script>
</body>
